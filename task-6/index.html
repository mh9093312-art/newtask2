<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        div{
            border: 3px solid black;
        }
    </style>
    <h1>Combinators</h1>
    <div>
        <h2>Descenden upgraded (space)</h2>
        <p>.tap p {color : red;}
        </p>
    </div>
    <br>
    <div>
        <h2>chlid combinator > </h2>
          <p>.tap > p {color : red;}
        </p>
    </div>
     <br>
    <div>
        <h2>adjacent sibling combinator + </h2>
          <p>.tap + p {color : red;}
        </p>
    </div>
    <br>
    <div>
        <h2>general sibling combinator ~</h2>
          <p>.tap ~ p {color : red;}
        </p>
    </div>
</body>
</html>
